<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password — CERIUM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f6fa}
.pg{--ac:#2f5bff;--bg:#f4f6fa;--ink:#0c1729;--mut:#566178;--ln:#dde3ee;--wh:#fff;--hf:"Castrade","Castrade Personal Use Only","Bricolage Grotesque",system-ui,sans-serif;--bf:"Figtree",system-ui,sans-serif;position:relative;isolation:isolate;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--bf);min-height:100vh;display:flex;flex-direction:column}
.pg *{box-sizing:border-box}.pg a{color:inherit;text-decoration:none}
.pg h1,.pg h2,.lg{font-family:var(--hf);font-weight:700;letter-spacing:-.03em;line-height:1.04;margin:0}
.w{max-width:1160px;margin:0 auto;padding:0 24px;width:100%}
.hd{display:flex;align-items:center;gap:32px;padding-top:22px;padding-bottom:22px}
.lg{display:flex;align-items:center;gap:10px;font-size:23px}
.pg .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:99px;background:var(--ac);color:#fff;font:600 15px var(--bf);border:0;cursor:pointer}
.acard{max-width:480px;margin:40px auto 80px;background:var(--wh);border:1px solid var(--ln);border-radius:26px;padding:clamp(24px,3.5vw,36px);box-shadow:0 30px 60px -30px rgba(12,23,41,.25)}
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld label{font:600 13.5px var(--bf)}
.fld input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:#fcfdff;font:400 15px var(--bf)}
.msg{margin:16px 0 0;font-size:14px;border-radius:12px;display:none}
.msg.err{display:block;padding:10px 14px;background:#fdecd8;color:#93370d}
.msg.ok{display:block;padding:10px 14px;background:#d9f2e4;color:#05603a}
.swap{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--ln);font-size:14px;color:var(--mut);text-align:center}.swap a{color:var(--ac);font-weight:600}
</style>
<link rel="stylesheet" href="css/spatial.css">
</head>
<body>
<div class="pg">
<header class="w hd">
  <a class="lg" href="index.html">
    <img src="img/cerium-logo-30.png" width="30" height="30" alt="" aria-hidden="true">
    CERIUM
  </a>
</header>

<main class="w">
  <div class="acard" data-rv>
    <h2>Choose New Password</h2>
    <p style="margin:8px 0 20px;color:var(--mut);font-size:15px">Enter your new secure password below (minimum 8 characters with at least one letter and one number).</p>

    <form id="reset-form">
      <div class="fld">
        <label for="password">New Password</label>
        <input id="password" type="password" required autocomplete="new-password" placeholder="••••••••">
      </div>
      <div class="fld">
        <label for="confirm-password">Confirm New Password</label>
        <input id="confirm-password" type="password" required autocomplete="new-password" placeholder="••••••••">
      </div>
      <button class="btn" type="submit" style="width:100%">Update Password &amp; Sign In</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <p class="swap"><a href="login.html">Cancel &amp; return to Sign In</a></p>
  </div>
</main>
</div>

<script src="js/cursor.js"></script>
<script src="js/auth-forms.js"></script>
</body>
</html>
