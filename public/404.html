<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found · CERIUM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f6fa}
.pg{--ac:#2f5bff;--bg:#f4f6fa;--ink:#0c1729;--mut:#566178;--ln:#dde3ee;--wh:#fff;--hf:"Castrade","Castrade Personal Use Only","Bricolage Grotesque",system-ui,sans-serif;--bf:"Figtree",system-ui,sans-serif;font:400 17px/1.55 var(--bf);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;position:relative;overflow:hidden}
.card{background:#fff;border:1px solid var(--ln);border-radius:28px;padding:48px 36px;max-width:520px;box-shadow:0 30px 60px -30px rgba(12,23,41,.2);position:relative;z-index:2}
h1{font-family:var(--hf);font-size:clamp(3rem,6vw,4.5rem);margin:0 0 12px;color:var(--ac)}
h2{font-family:var(--hf);font-size:clamp(1.4rem,3vw,1.8rem);margin:0 0 16px;color:var(--ink)}
p{color:var(--mut);margin:0 0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600}
</style>
<link rel="stylesheet" href="css/spatial.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/landing-workspace-cursor.css">
<link rel="stylesheet" href="css/brand-motion.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body>
<div class="pg home" id="pg" style="--ac:#2f5bff">
  <div class="sp-grid" aria-hidden="true"></div>
  <div class="card" data-rv>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you requested could not be found or has moved.</p>
    <a class="btn" href="/">Return to Home Page</a>
  </div>
</div>
<script src="js/workspace-cursor.js" defer></script>
<script src="js/home.js" defer></script>
</body>
</html>
