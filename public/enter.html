<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening CERIUM Workspace</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/entry-loader.css">
</head>
<body class="entry-page">
<main class="entry-scene" id="cerium-entry-scene" data-cerium-entry="redirect" aria-label="Opening your Cerium workspace">
  <div class="entry-visual" aria-hidden="true">
    <div class="entry-brand">
      <svg class="entry-frame" viewBox="0 0 318 62" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="316" height="60" rx="15" pathLength="1"/></svg>
      <span class="entry-mark"><img src="img/cerium-logo-mark-blue.png" width="30" height="33" alt="" decoding="sync"></span>
      <span class="entry-name"><span class="entry-letter">C</span><span class="entry-letter">E</span><span class="entry-letter">R</span><span class="entry-letter">I</span><span class="entry-letter">U</span><span class="entry-letter">M</span><span class="entry-entry-dot"></span></span>
    </div>
  </div>
  <p class="entry-caption" role="status">Preparing your workspace</p>
  <button class="entry-skip" type="button" data-entry-skip>Skip intro</button>
  <button class="entry-retry" type="button" data-entry-retry hidden>Try again</button>
</main>
<script src="js/entry-loader.js" defer></script>
</body>
</html>
